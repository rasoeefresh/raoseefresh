<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E9F26"/>
      <stop offset="50%" stop-color="#0C831F"/>
      <stop offset="100%" stop-color="#075E16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F8CB46"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Glow -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Golden Emblem Container -->
  <g filter="url(#dropShadow)">
    <!-- Central Badge -->
    <rect x="96" y="65" width="320" height="235" rx="55" fill="url(#goldGrad)"/>
    
    <!-- Shopping Cart / Fresh Produce Emblem -->
    <path d="M165 125 H198 L218 215 H318 L345 150 H212" fill="none" stroke="#0C831F" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="235" cy="250" r="15" fill="#0C831F"/>
    <circle cx="305" cy="250" r="15" fill="#0C831F"/>
    
    <!-- Fresh Sprouting Leaf in Cart -->
    <path d="M255 170 C235 130 270 105 310 110 C310 148 282 176 255 170 Z" fill="#086317"/>
    <path d="M255 170 C272 150 292 135 310 110" stroke="#FFE066" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <!-- "RASOEE" in Clean Modern Pure White Bold -->
  <text x="256" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">RASOEE</text>
  
  <!-- "FRESH" in Golden Yellow Banner / Lettering -->
  <g filter="url(#dropShadow)">
    <rect x="156" y="405" width="200" height="48" rx="24" fill="url(#goldGrad)"/>
    <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#0C831F" text-anchor="middle" letter-spacing="6">FRESH</text>
  </g>
</svg>
